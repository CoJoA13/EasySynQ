# Dependency-update automation (Phase-1 tech-debt: I-5). LIVE AGAIN as of R86 (2026-09-21): GitHub is
# the primary host once more and Dependabot is the ONLY updater. Between 2026-09-08 and 2026-09-21 the
# repository lived on GitLab and dependency updates ran through a self-hosted Renovate; that
# configuration (renovate.json, renovate-self-hosted.cjs, scripts/run-renovate.sh) is removed, and the
# Renovate rules that survive re-expression are folded in below. Two things Dependabot does NOT track
# and that are therefore manual: the `npm install --global npm@X` pin in apps/web/Dockerfile (guarded
# `<12` by test_deploy_configuration) and the `uv==` pin in apps/api/Dockerfile. Its `docker-compose`
# ecosystem bumps compose tags only, so every compose image PR needs infra/images.lock refreshed by
# hand before `compose-images-lock` goes green. Air-gap-safe — Dependabot only opens PRs against this
# GitHub repo; the self-hosted prod host never phones home. Minor/patch are grouped to keep PR noise
# low; majors come as individual PRs (they usually need a human migration). Tune the limits/cadence
# freely. NOTE: Dependabot updates the manifests + lockfiles, but CI (uv sync --frozen / npm ci) still
# gates every bump, and the `security` CI job surfaces advisories independently.
#
# Every entry waits out a seven-day `cooldown` before proposing a newly published version: most
# hijacked-package releases are caught and yanked within days, and a week costs nothing on a weekly
# schedule. Cooldown applies to version updates only; Dependabot SECURITY updates (enabled in the
# repository settings) still open immediately. zizmor's dependabot-cooldown audit in the
# `workflow-and-secrets` CI job holds this at seven days or more.
version: 2
updates:
  # Python API (uv — updates pyproject.toml + uv.lock together)
  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # reportlab is deliberately capped <5 — stamp_controlled_copy's byte-determinism depends on
      # reportlab invariant mode (apps/api/pyproject.toml); a v5 bump needs a dedicated byte-output
      # verification, not an auto-merge (closed PR #271). Stay on 4.x minor/patch.
      - dependency-name: "reportlab"
        update-types: ["version-update:semver-major"]

  # Web SPA
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Mantine majors are a deliberate UI-lib migration (D4 — fixed stack; the SPA targets v7); a v8/v9
      # jump breaks the build and is its own scoped project, not an auto-bump (closed PR #266). Minor/patch
      # within v7 still flow via web-minor-patch.
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]

  # Contract-generation tools (the separately locked Node toolchain used by the contracts CI job)
  - package-ecosystem: "npm"
    directory: "/packages/contracts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      contract-tools-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # js-yaml majors are refused. js-yaml reaches this toolchain through openapi-typescript ->
      # @redocly/openapi-core, which calls js_yaml.types.merge at module load; that export is gone in
      # js-yaml 5, so the module throws, contract generation produces nothing, and `redocly lint`
      # still passes (closed GitLab MR !7 under Renovate). The `overrides` in
      # packages/contracts/package.json pins js-yaml at 4.3.2 (a patched 4.x, keeping Redocly off the
      # vulnerable 4.3.0). Dependabot does NOT edit `overrides`, so this entry is documentation of
      # intent rather than the mechanism: the pin never moves on its own, and a js-yaml advisory is a
      # manual action. Revisit when @redocly/openapi-core itself supports js-yaml 5.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]

  # CI action pins (keeps the SHA-pinned astral-sh/setup-uv and actions/* fresh, bumping each SHA and
# its version comment together). The trivy, actionlint, zizmor and gitleaks images that ci.yml runs
# from shell steps are NOT tracked here; they are manual pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      ci-actions:
        update-types: ["minor", "patch"]

  # Container base images (FROM lines in the two Dockerfiles)
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # The API interpreter is pinned to 3.12 by `requires-python = ">=3.12,<3.13"`
      # (apps/api/pyproject.toml) and .python-version; moving it is a deliberate slice, not an
      # auto-bump. ⚠ A newer base does NOT fail the build — it fails at RUNTIME, and at the time
      # no CI job that could block a merge started the image (closed PR #448, python 3.12 -> 3.14,
      # CLEAN on all sixteen checks). With a 3.14 base,
      # `uv sync --locked` cannot satisfy requires-python from /usr/local/bin, so it downloads a
      # managed CPython 3.12 into /root/.local/share/uv/python/ and points the venv's `home` there.
      # /root is 0700, the image runs as USER easysynq (uid 10001), and the CMD `uv run gunicorn`
      # then dies with "Failed to query Python interpreter ... Permission denied". The `security`
      # job BUILDS this image but only Trivy-scans it, and the one test that WOULD catch this
      # (test_the_built_api_image_is_unprivileged_and_starts_offline) is skipif-gated on
      # EASYSYNQ_IMAGE_PROOF, which nothing set until S-image-proof-enabled wired it into the
      # required `api` job. The static
      # base/requires-python coupling is blocking in the required `api` job
      # (test_api_image_python_major_matches_requires_python); this ceiling stops the weekly PR.
      - dependency-name: "python"
        versions: [">=3.13"]
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/infra/compose/keycloak"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Deployed stack runtime images pinned in infra/compose/compose.yml (postgres, redis, minio,
  # gotenberg, tika, caddy, mailpit) — a SEPARATE Dependabot ecosystem from the Dockerfiles
  # (`docker-compose`), else those service images never get the weekly update PRs (Codex #153).
  - package-ecosystem: "docker-compose"
    directory: "/infra/compose"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
