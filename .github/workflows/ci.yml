name: ci

on:
  push:
    branches: [main]
    # A version tag is what makes the release gate below fire. Without this trigger the digest-pin
    # guard had nothing to run on and a release shipped floating image tags on a green CI run.
    tags: ['v*']
  pull_request:

# A newer push to the same PR supersedes the in-flight run — cancel it. Push (main) runs each get
# a unique group (run_id) so back-to-back merges never queue-cancel each other (GitHub allows only
# one running + one pending run per group, regardless of cancel-in-progress).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Agent authority and Claude compatibility contracts
        run: |
          bash scripts/tests/test-agent-authority.sh
          bash scripts/tests/test-claude-hooks.sh
          ./scripts/check-repo-authority.sh
      # R61 backstop lives in THIS job because contracts IS in branch protection's required
      # checks — `security` remains outside that required-check set, so a site-data match there
      # would not block a merge.
      - name: R61 backstop regression harness
        run: bash scripts/tests/test-check-no-site-data.sh
      - name: R61 site-data backstop (check-no-site-data)
        run: ./scripts/check-no-site-data.sh
      - name: doctor shell contracts
        run: bash scripts/tests/test-doctor.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: PostgreSQL MCP disabled contract
        run: node --test scripts/tests/test-postgres-mcp-disabled.mjs
      - name: CI workflow contract
        run: |
          bash scripts/tests/test-ci-hardening.sh
          bash scripts/tests/test-check-compose-images-lock.sh
      - name: install locked contract tools
        run: npm ci --prefix packages/contracts --ignore-scripts
      - name: contract toolchain regressions
        run: |
          bash scripts/tests/test-run-contract-tool.sh
          node --test scripts/tests/test-contract-lock.mjs
          bash scripts/tests/test-gen-contracts.sh
      - name: lint OpenAPI
        run: bash scripts/run-contract-tool.sh redocly lint --config packages/contracts/redocly.yaml packages/contracts/openapi.yaml
      - name: audit locked contract tools
        run: npm --prefix packages/contracts audit --package-lock-only --audit-level=high
      - name: generated contract lock
        run: bash scripts/gen-contracts.sh --check

  # Required authenticated live-response contract gate. D-9 operations retained as future contract
  # shapes must be explicitly marked deferred and exactly excluded; every mounted operation runs.
  contract-responses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - working-directory: apps/api
        run: uv sync --frozen
      - name: validate authenticated operational responses (disposable testcontainers only)
        working-directory: apps/api
        run: uv run pytest tests/integration/test_contract_response_schemas.py -m contract --tb=short

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate dev, online-production, and appliance Compose overlays
        run: |
          # --env-file supplies interpolation values; the services' env_file entries still require
          # the repo-root .env to exist. Materialize the ignored runner copy from the safe template.
          cp .env.example .env
          docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.dev.yml config --quiet
          export SITE_ADDRESS=https://qms.example.test
          export MINIO_SITE_ADDRESS=https://qms.example.test:9443
          export S3_PUBLIC_ENDPOINT=https://qms.example.test:9443
          export PUBLIC_BASE_URL=https://qms.example.test
          export APP_BASE_URL=https://qms.example.test
          export KEYCLOAK_HOSTNAME=https://qms.example.test
          export KEYCLOAK_DB_PASSWORD=ci-compose-only
          docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.production.yml config --quiet
          docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.airgap.yml \
            -f infra/compose/compose.production.yml config --quiet
          # The exact stack `scripts/install.sh --offline` builds (C13). `config --images` must
          # resolve the locally built images by name — that naming is what lets a `docker load` of
          # the air-gap bundle satisfy Compose without a network build on the target.
          docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.production.yml \
            -f infra/compose/compose.offline.yml config --quiet
          EASYSYNQ_IMAGE_TAG="$(bash scripts/app-images.sh --tag)"
          export EASYSYNQ_IMAGE_TAG
          composed_images="$(docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.production.yml \
            -f infra/compose/compose.offline.yml config --images)"
          while IFS= read -r bundled; do
            printf '%s\n' "$composed_images" | grep -qxF "$bundled" || {
              echo "::error::the air-gap bundle builds $bundled but no service resolves to it"
              exit 1
            }
          done < <(bash scripts/app-images.sh)
      - name: install uv
        # exact pin — setup-uv stopped publishing floating major tags at v8
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - name: sync
        working-directory: apps/api
        run: uv sync --frozen
      - name: lint
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check --diff .
      - name: lint migrations
        run: |
          uv run --project apps/api ruff check --config ruff.toml migrations
          uv run --project apps/api ruff format --check --diff --config ruff.toml migrations
      - name: types
        working-directory: apps/api
        run: uv run mypy src
      - name: unit tests
        working-directory: apps/api
        run: uv run pytest tests/unit -m unit

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: easysynq
          POSTGRES_PASSWORD: easysynq
          POSTGRES_DB: easysynq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U easysynq" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_SYNC: postgresql+psycopg://easysynq:easysynq@localhost:5432/easysynq
      DATABASE_URL: postgresql+psycopg://easysynq:easysynq@localhost:5432/easysynq
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - working-directory: apps/api
        run: uv sync --frozen
      - name: upgrade head then downgrade base (reversible) then back to head
        working-directory: apps/api
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - name: populated migration coherence regressions
        working-directory: apps/api
        env:
          # The test creates and drops its own scratch DB on this disposable CI-only PG18 service.
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://easysynq:easysynq@localhost:5432/easysynq
        run: uv run pytest tests/migration/test_migration_coherence.py
      - name: autogenerate drift check (models == migrations)
        working-directory: apps/api
        run: uv run alembic check

  # The integration suite is sharded across N parallel runners (pytest-split, balanced by the
  # committed apps/api/.test_durations). Each shard is its own process spinning its own testcontainers
  # → the single-DB / single-org contract holds per shard. ~45 min serial → ~13 min wall.
  #
  # Each green shard also re-times exactly the tests it ran (--store-durations --clean-durations
  # replaces the workspace file with this shard's fresh timings; the *split* still reads the
  # committed file) and publishes them as an artifact. scripts/refresh-test-durations.sh merges the
  # four into apps/api/.test_durations — re-run it whenever shard wall-clocks drift apart.
  integration-shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - working-directory: apps/api
        run: uv sync --frozen
      # The runner image preinstalls postgresql-client-16. pg_dump REFUSES a newer server, so a 16
      # client against the postgres:18 testcontainer aborts every backup/restore test with
      # `server version mismatch` -- 19 failures naming a version, not a cause. PGDG is already
      # configured on the runner, so this is an install, not a repository add.
      - name: install the postgres client matching the testcontainer major
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version
      - name: integration tests (shard ${{ matrix.group }}/4, testcontainers spin their own Postgres)
        working-directory: apps/api
        run: >-
          uv run pytest tests/integration -m integration --splits 4 --group ${{ matrix.group }}
          --durations-path .test_durations --store-durations --clean-durations
      - name: publish fresh shard durations
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-${{ matrix.group }}
          path: apps/api/.test_durations
          # dotfile: v4 excludes hidden files by default → without this the upload silently
          # matches zero files; error (not the default warn) keeps that failure loud.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Aggregator gate: keeps the required-status-check name "integration" stable (no branch-protection
  # change needed) and passes iff EVERY shard passed.
  integration:
    needs: integration-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: gate on the shard results
        run: |
          result='${{ needs.integration-shards.result }}'
          if [ "$result" != "success" ]; then
            echo "integration shards did not all pass (result=$result)"; exit 1
          fi
          echo "all integration shards passed"

  # Preserve one worker per process (the suite's jsdom teardown contract) while distributing the full
  # file set across two isolated runners. Static checks run on shard 2's already-hydrated workspace;
  # !cancelled() keeps those checks visible even if that shard's Vitest step fails.
  web-shards:
    name: web tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - name: Vitest shard ${{ matrix.shard }}/2
        working-directory: apps/web
        run: npm test -- --shard=${{ matrix.shard }}/2
      - name: lint and build
        if: ${{ !cancelled() && matrix.shard == 2 }}
        working-directory: apps/web
        run: npm run lint && npm run build

  web-browser:
    name: web browser (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - name: install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: responsive browser evidence
        working-directory: apps/web
        run: npm run test:browser
      - name: upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Stable aggregate gate: passes iff both complete Vitest partitions (including shard 2's
  # lint/type/build step) and the Chromium browser suite passed. Keep this job name stable for the
  # convention-only required-check set and a future branch-protection ruleset.
  web:
    name: web
    needs: [web-shards, web-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: gate on the shard results
        run: |
          shards_result='${{ needs.web-shards.result }}'
          browser_result='${{ needs.web-browser.result }}'
          if [ "$shards_result" != "success" ] || [ "$browser_result" != "success" ]; then
            echo "web checks did not all pass (web-shards=$shards_result, web-browser=$browser_result)"
            exit 1
          fi
          echo "all web checks passed"

  # Dependency + filesystem + base-image vulnerability scan (Phase-1 tech-debt: I-1).
  # npm high/critical findings are GATED; pip-audit and Trivy FINDINGS remain REPORT-ONLY.
  # Operational failures fail the job so a never-ran scan cannot read green (Codex #153). NOT in
  # branch protection's required checks. RATCHET the remaining report-only findings once their
  # baselines are clean: gate pip-audit findings, set trivy `exit-code: "1"`, and add `security` to
  # the required checks.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - name: pip-audit runner regressions
        run: bash scripts/tests/test-pip-audit-runner.sh
      - name: pip-audit (Python deps, resolved from uv.lock)
        run: bash scripts/run-pip-audit.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install frozen web dependencies for npm policy
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: npm advisory policy regressions
        run: |
          node --test \
            scripts/tests/test-web-security-lock.mjs \
            scripts/tests/test-npm-audit-runner.mjs \
            scripts/tests/test-check-npm-audit.mjs \
            scripts/tests/test-npm-audit-policy.mjs \
            scripts/tests/test-router-rsc-policy.mjs
      - name: npm advisory policy (web lock)
        run: node scripts/check-npm-audit.mjs
      - name: trivy filesystem scan (vuln + secret + IaC misconfig; HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
      # The fs scan above does NOT detect base-image / apt / copied-stage CVEs (Trivy needs an image
      # target). BUILD the API image and scan THAT so it covers exactly what ships — the python base +
      # the apt layer (postgresql-client, libmagic) + the /uv binary copied from the `uv` stage (Codex
      # #153). The web image has no apt/COPY-from, so its base ref (derived from the Dockerfile FROM so
      # it tracks Dependabot bumps) + npm-audit suffice. No `continue-on-error`: a build/scan failure
      # should SURFACE (the job is non-required, so it never blocks a merge).
      - name: build the API image (scan target = exactly what ships)
        run: docker build -f apps/api/Dockerfile -t easysynq-api:scan .
      - name: trivy image scan — built API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: easysynq-api:scan
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
      - name: resolve the web base ref (tracks the Dockerfile FROM Dependabot bumps)
        id: webbase
        run: echo "ref=$(grep -E '^FROM ' apps/web/Dockerfile | tail -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: trivy image scan — web base
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.webbase.outputs.ref }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  # The air-gap bundle (scripts/airgap-bundle.sh) collects image refs from infra/images.lock, so a
  # Dependabot bump to compose.yml (the new `docker-compose` ecosystem) must ALSO land in images.lock,
  # or the offline bundle ships the stale ref while Compose asks for the new one (Codex #153). Assert
  # every Compose `image:` ref plus the optimized Keycloak Dockerfile base is pinned in images.lock.
  # The RELEASE gate. test_images_lock_pinned.py refuses a floating tag on any non-dev image, but
  # it SKIPS unless EASYSYNQ_RELEASE=1 — and nothing set it, so the check was inert and a release
  # could ship unpinned third-party images with every check green (audit follow-up). Tag-only,
  # because floating tags stay legal during ordinary development.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - name: sync
        working-directory: apps/api
        run: uv sync --frozen
      - name: every non-dev image must be digest-pinned
        working-directory: apps/api
        env:
          EASYSYNQ_RELEASE: "1"
        run: uv run pytest tests/unit/test_images_lock_pinned.py -q

  compose-images-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Digest-aware (audit C15): the release ceremony rewrites images.lock to `name:tag@sha256:…`
      # refs, which the previous exact-string comparison read as "missing" — making a green gate
      # and a digest-pinned release lock mutually exclusive. The extracted script strips digests
      # before comparing; its regression harness runs in the contracts job.
      - name: every deployed/base image must be pinned in infra/images.lock
        run: bash scripts/check-compose-images-lock.sh
