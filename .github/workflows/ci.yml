name: ci

# The gate for this repository (R86). Rebuilt from the GitLab pipeline it replaces, not patched
# from the pre-2026-09-08 workflow, which had drifted: it lacked eight guard scripts, the docs
# lane, the built-image scans and the runtime acceptance, and still called `security`
# non-required. Policy, in one place:
#
#  * A pull request runs on the MERGE COMMIT of its head onto main. With the ruleset's "require
#    branches to be up to date" and squash-only merging, the final check run on the PR head is
#    the tree main receives, and it is the merge evidence. Plain branch pushes run nothing.
#  * In a pull request, a suite runs only when a path it reads differs from main. The lists live
#    in .github/ci-paths.yml, and a unit test walks `git ls-files` to prove every non-docs path is
#    in `code`. A docs-only PR (docs/** and root *.md) runs the guards plus `docs-tests`.
#  * A push to main (post-merge) re-runs only the cheap backstops: the guards, migrations and the
#    security scan. Tags and manually started runs execute every suite.
#  * `gate` is the ONLY required status check. It needs every job and fails if any job failed, was
#    cancelled, or was skipped while its own condition said it should run. GitHub cannot require
#    a path-conditional job directly — a skipped required check blocks merging forever — so the
#    aggregator the GitLab port dropped comes back as one job over all of them.
#  * A newer commit cancels an in-flight run of the same pull request; main runs never cancel.

on:
  push:
    branches: [main]
    # A version tag is what makes the release gate fire. Without this trigger the digest-pin
    # guard had nothing to run on and a release shipped floating image tags on a green CI run.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.13"
  UV_PYTHON_DOWNLOADS: never

jobs:
  # ------------------------------------------------------------------ what changed
  # Every conditional job keys off these outputs. Outside a pull request they are all "true"
  # for a tag or manual run and all "false" for a main push, so the policy above is decided here
  # once rather than in thirteen `if:` expressions that could drift.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      api_suites: ${{ steps.filter.outputs.api_suites }}
      web_suites: ${{ steps.filter.outputs.web_suites }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      full: ${{ steps.filter.outputs.full }}
      main_push: ${{ steps.filter.outputs.main_push }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: decide which suites this run owes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REF: ${{ github.ref }}
        run: python3 scripts/ci-changed-paths.py

  # ------------------------------------------------------------------ guards (every run)
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run the R61 backstop before hydrating dependencies. The site-data backstop is separate
      # from the vulnerability gates in the security job.
      - name: Agent authority and Claude compatibility contracts
        run: |
          bash scripts/tests/test-agent-authority.sh
          bash scripts/tests/test-claude-hooks.sh
          ./scripts/check-repo-authority.sh
      - name: R61 backstop regression harness
        run: bash scripts/tests/test-check-no-site-data.sh
      - name: R61 site-data backstop (check-no-site-data)
        run: ./scripts/check-no-site-data.sh
      - name: doctor shell contracts
        run: bash scripts/tests/test-doctor.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: PostgreSQL MCP disabled contract
        run: node --test scripts/tests/test-postgres-mcp-disabled.mjs
      - name: CI workflow contract
        run: |
          bash scripts/tests/test-ci-hardening.sh
          bash scripts/tests/test-check-compose-images-lock.sh
      - name: install locked contract tools
        run: npm ci --prefix packages/contracts --ignore-scripts
      - name: contract toolchain regressions
        run: |
          bash scripts/tests/test-run-contract-tool.sh
          node --test scripts/tests/test-contract-lock.mjs
          bash scripts/tests/test-gen-contracts.sh
      - name: lint OpenAPI
        run: bash scripts/run-contract-tool.sh redocly lint --config packages/contracts/redocly.yaml packages/contracts/openapi.yaml
      - name: audit locked contract tools
        run: npm --prefix packages/contracts audit --package-lock-only --audit-level=high
      - name: generated contract lock
        run: bash scripts/gen-contracts.sh --check

  compose-images-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Digest-aware (audit C15): the release ceremony rewrites images.lock to `name:tag@sha256:…`
      # refs; the script strips digests before comparing, and its harness runs in `contracts`.
      - name: every deployed/base image must be pinned in infra/images.lock
        run: bash scripts/check-compose-images-lock.sh

  # ------------------------------------------------------------------ code (any non-docs change)
  api:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: hosting and tooling contracts
        run: |
          bash scripts/tests/test-contributor-hosting.sh
          python3 scripts/tests/test-refresh-test-durations.py
      - name: validate dev, online-production, and appliance Compose overlays
        run: |
          # --env-file supplies interpolation values; the services' env_file entries still require
          # the repo-root .env to exist. Materialize the ignored runner copy from the safe template.
          cp .env.example .env
          docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.dev.yml config --quiet
          export SITE_ADDRESS=https://qms.example.test
          export MINIO_SITE_ADDRESS=https://qms.example.test:9443
          export S3_PUBLIC_ENDPOINT=https://qms.example.test:9443
          export PUBLIC_BASE_URL=https://qms.example.test
          export APP_BASE_URL=https://qms.example.test
          export KEYCLOAK_HOSTNAME=https://qms.example.test
          export KEYCLOAK_DB_PASSWORD=ci-compose-only
          docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.production.yml config --quiet
          docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.airgap.yml \
            -f infra/compose/compose.production.yml config --quiet
          # The exact stack `scripts/install.sh --offline` builds (C13). `config --images` must
          # resolve the locally built images by name — that naming is what lets a `docker load` of
          # the air-gap bundle satisfy Compose without a network build on the target.
          docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.production.yml \
            -f infra/compose/compose.offline.yml config --quiet
          EASYSYNQ_IMAGE_TAG="$(bash scripts/app-images.sh --tag)"
          export EASYSYNQ_IMAGE_TAG
          composed_images="$(docker compose --env-file .env.example \
            -f infra/compose/compose.yml \
            -f infra/compose/compose.s.yml \
            -f infra/compose/compose.production.yml \
            -f infra/compose/compose.offline.yml config --images)"
          while IFS= read -r bundled; do
            printf '%s\n' "$composed_images" | grep -qxF "$bundled" || {
              echo "::error::the air-gap bundle builds $bundled but no service resolves to it"
              exit 1
            }
          done < <(bash scripts/app-images.sh)
      - name: install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - name: sync
        working-directory: apps/api
        run: uv sync --frozen
      - name: lint
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check --diff .
      - name: lint migrations
        run: |
          uv run --project apps/api ruff check --config ruff.toml migrations
          uv run --project apps/api ruff format --check --diff --config ruff.toml migrations
      - name: types
        working-directory: apps/api
        run: uv run mypy src
      # EASYSYNQ_IMAGE_PROOF un-skips the built-image runtime proof: it BUILDS the API image and
      # runs it (uid 10001, `uv run` with NO network). The security scans inspect findings and do
      # not prove that the built image can start; this is the only gate that starts the artifact,
      # and it lives here, in a job that can fail a merge. The runner is unprivileged, so the six
      # fail-closed permission tests run as written, with no privilege drop needed.
      - name: unit tests
        working-directory: apps/api
        env:
          EASYSYNQ_IMAGE_PROOF: "1"
        run: uv run pytest tests/unit -m unit
      # The external-trust acceptance builds the exact checkout for its public-CLI custody proof
      # and the eleven mandatory runtime cases. Both must succeed before merging.
      - name: mandatory runtime acceptance (built image)
        run: python3 scripts/run-audit-external-acceptance.py

  migrations:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.main_push == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: easysynq
          POSTGRES_PASSWORD: easysynq
          POSTGRES_DB: easysynq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U easysynq" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_SYNC: postgresql+psycopg://easysynq:easysynq@localhost:5432/easysynq
      DATABASE_URL: postgresql+psycopg://easysynq:easysynq@localhost:5432/easysynq
      # The suite creates and drops its own scratch DB on this disposable CI-only PG18 service.
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://easysynq:easysynq@localhost:5432/easysynq
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - working-directory: apps/api
        run: uv sync --frozen
      - name: upgrade head then downgrade base (reversible) then back to head
        working-directory: apps/api
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      # The whole tree, not one file: the coherence test pins the single head by name and replays
      # populated historical transitions the empty round-trip above never exercises.
      - name: populated migration coherence regressions
        working-directory: apps/api
        run: uv run pytest tests/migration
      - name: autogenerate drift check (models == migrations)
        working-directory: apps/api
        run: uv run alembic check

  security:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.main_push == 'true'
    runs-on: ubuntu-latest
    # npm high/critical findings and built-image fix-available HIGH/CRITICAL findings are GATED.
    # No-fix image findings remain OPEN; pip-audit, filesystem and image secrets stay advisory.
    # Operational failures fail the job and block merging; a never-ran scan cannot read green.
    steps:
      - uses: actions/checkout@v7
      - name: install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - name: pip-audit runner regressions
        run: bash scripts/tests/test-pip-audit-runner.sh
      - name: pip-audit (Python deps, resolved from uv.lock)
        run: bash scripts/run-pip-audit.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install frozen web dependencies for npm policy
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: npm advisory policy regressions
        run: |
          node --test \
            scripts/tests/test-web-security-lock.mjs \
            scripts/tests/test-npm-audit-runner.mjs \
            scripts/tests/test-check-npm-audit.mjs \
            scripts/tests/test-npm-audit-policy.mjs \
            scripts/tests/test-router-rsc-policy.mjs
      - name: npm advisory policy (web lock)
        run: node scripts/check-npm-audit.mjs
      # The pinned trivy binary, copied out of its image so the scan runs with exactly the
      # environment we control. ⚠ Manual pin (R86): no updater reads an image name in a shell step.
      # environment scripts/check-built-image-security.sh controls (it unsets every TRIVY_* it
      # does not own). Databases come from the same Docker Hub mirrors the images.lock uses.
      - name: install the pinned trivy
        run: |
          trivy_container=$(docker create aquasec/trivy:0.74.0)
          docker cp "$trivy_container:/usr/local/bin/trivy" /tmp/trivy
          docker rm "$trivy_container" >/dev/null
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          echo "TRIVY_DB_REPOSITORY=docker.io/aquasec/trivy-db:2" >> "$GITHUB_ENV"
          echo "TRIVY_JAVA_DB_REPOSITORY=docker.io/aquasec/trivy-java-db:1" >> "$GITHUB_ENV"
          echo "TRIVY_CHECKS_BUNDLE_REPOSITORY=docker.io/aquasec/trivy-checks:1" >> "$GITHUB_ENV"
          echo "TRIVY_SKIP_VERSION_CHECK=true" >> "$GITHUB_ENV"
      - name: trivy filesystem scan (vuln + secret + IaC misconfig; HIGH/CRITICAL; advisory)
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --format table .
      - name: built-image gate regressions
        run: bash scripts/tests/test-built-image-security.sh
      # The filesystem scan cannot see base-image/apt/copied-stage findings. Build both actual
      # artifacts with their production contexts and gate their private, validated image reports.
      - name: build both application images (scan targets = exactly what ships)
        run: |
          docker build -f apps/api/Dockerfile -t easysynq-api:scan .
          docker build -f apps/web/Dockerfile -t easysynq-web:scan apps/web
      - name: built-image fixed-version threshold (gated)
        run: bash scripts/check-built-image-security.sh

  # ------------------------------------------------------------------ docs-only lane
  # Selection is by content, not a list: every unit test file that names a documentation path
  # runs, so a new docs-reading test joins the lane automatically. An empty selection fails the
  # job rather than passing it vacuously. Docker is present because some selected files assert
  # its presence rather than skipping.
  docs-tests:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    env:
      # Two alternatives are quote-anchored on purpose: `"docs"` matches a quoted path segment
      # (ROOT / "docs" / ...) without matching every identifier containing "docs", and `\.md"`
      # matches any quoted *.md path. Do not "balance" the quotes; a unit test pins the selection.
      DOCS_TEST_PATTERN: '"docs"|docs/|README|AGENTS|CLAUDE|CONTRIBUTING|LICENSING|PRODUCT\.md|\.md"'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - working-directory: apps/api
        run: uv sync --frozen
      - name: unit tests that read documentation
        working-directory: apps/api
        run: |
          files="$(grep -rlE "$DOCS_TEST_PATTERN" tests/unit --include="test_*.py" | sort)"
          test -n "$files"
          uv run pytest $files -m unit

  # ------------------------------------------------------------------ API-side suites
  contract-responses:
    needs: changes
    if: needs.changes.outputs.api_suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - working-directory: apps/api
        run: uv sync --frozen
      - name: validate authenticated operational responses (disposable testcontainers only)
        working-directory: apps/api
        run: uv run pytest tests/integration/test_contract_response_schemas.py -m contract --tb=short

  # The integration suite is sharded across four runners (pytest-split, balanced by the committed
  # apps/api/.test_durations). Each shard is its own process spinning its own testcontainers, so
  # the single-DB / single-org contract holds per shard. Each green shard re-times exactly the
  # tests it ran and publishes them; scripts/refresh-test-durations.sh merges the four.
  integration-shards:
    needs: changes
    if: needs.changes.outputs.api_suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - working-directory: apps/api
        run: uv sync --frozen
      # The runner image preinstalls postgresql-client-16. pg_dump REFUSES a newer server, so a 16
      # client against the postgres:18 testcontainer aborts every backup/restore test with
      # `server version mismatch` — 19 failures naming a version, not a cause.
      - name: install the postgres client matching the testcontainer major
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # Installing 18 is NOT enough: pg_wrapper keeps resolving a bare `pg_dump` to 16. Pin the
          # versioned bin dir ahead of it.
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      # $GITHUB_PATH applies to LATER steps, so the resolution itself is asserted in its own step.
      - name: confirm pg_dump 18 wins PATH
        run: pg_dump --version | grep -qE '\) 18\.' || { pg_dump --version; exit 1; }
      - name: integration tests (shard ${{ matrix.group }}/4, testcontainers spin their own Postgres)
        working-directory: apps/api
        run: >-
          uv run pytest tests/integration -m integration --splits 4 --group ${{ matrix.group }}
          --durations-path .test_durations --store-durations --clean-durations
      - name: publish fresh shard durations
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-${{ matrix.group }}
          path: apps/api/.test_durations
          # dotfile: excluded by default → without this the upload silently matches zero files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ web suites
  # One worker per process (the suite's jsdom teardown contract) across two isolated runners.
  # Static checks run on shard 2's already-hydrated workspace; !cancelled() keeps them visible
  # even if that shard's Vitest step fails.
  web-shards:
    name: web tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.web_suites == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - name: Vitest shard ${{ matrix.shard }}/2
        working-directory: apps/web
        run: npm test -- --shard=${{ matrix.shard }}/2
      - name: lint and build
        if: ${{ !cancelled() && matrix.shard == 2 }}
        working-directory: apps/web
        run: npm run lint && npm run build

  web-browser:
    name: web browser (Chromium)
    needs: changes
    if: needs.changes.outputs.web_suites == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - name: install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: responsive browser evidence
        working-directory: apps/web
        run: npm run test:browser
      - name: upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------ release
  # test_images_lock_pinned.py SKIPS unless EASYSYNQ_RELEASE=1; nothing set it and the guard was
  # inert, so a release could ship floating third-party tags with every check green. Tag-only,
  # because floating tags stay legal during ordinary development.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - working-directory: apps/api
        run: uv sync --frozen
      - name: every non-dev image must be digest-pinned
        working-directory: apps/api
        env:
          EASYSYNQ_RELEASE: "1"
        run: uv run pytest tests/unit/test_images_lock_pinned.py -q

  # ------------------------------------------------------------------ the one required check
  gate:
    needs:
      - changes
      - contracts
      - compose-images-lock
      - api
      - migrations
      - security
      - docs-tests
      - contract-responses
      - integration-shards
      - web-shards
      - web-browser
      - release-gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: every job that owed a result delivered a success
        env:
          CODE: ${{ needs.changes.outputs.code }}
          API_SUITES: ${{ needs.changes.outputs.api_suites }}
          WEB_SUITES: ${{ needs.changes.outputs.web_suites }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          MAIN_PUSH: ${{ needs.changes.outputs.main_push }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          R_CHANGES: ${{ needs.changes.result }}
          R_CONTRACTS: ${{ needs.contracts.result }}
          R_COMPOSE_LOCK: ${{ needs.compose-images-lock.result }}
          R_API: ${{ needs.api.result }}
          R_MIGRATIONS: ${{ needs.migrations.result }}
          R_SECURITY: ${{ needs.security.result }}
          R_DOCS: ${{ needs.docs-tests.result }}
          R_CONTRACT_RESPONSES: ${{ needs.contract-responses.result }}
          R_INTEGRATION: ${{ needs.integration-shards.result }}
          R_WEB_SHARDS: ${{ needs.web-shards.result }}
          R_WEB_BROWSER: ${{ needs.web-browser.result }}
          R_RELEASE: ${{ needs.release-gate.result }}
        run: |
          set -u
          failed=0
          # owed <job> <result> <expected-to-run: true|false>
          owed() {
            local job="$1" result="$2" expected="$3"
            if [ "$expected" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::$job owed a result and reported $result"; failed=1
              else
                echo "ok   $job: success"
              fi
            else
              if [ "$result" = "skipped" ]; then
                echo "skip $job: not owed by this run"
              elif [ "$result" = "success" ]; then
                echo "ok   $job: success (ran although not owed)"
              else
                echo "::error::$job reported $result"; failed=1
              fi
            fi
          }
          owed changes            "$R_CHANGES"            true
          owed contracts          "$R_CONTRACTS"          true
          owed compose-images-lock "$R_COMPOSE_LOCK"      true
          owed api                "$R_API"                "$CODE"
          if [ "$CODE" = "true" ] || [ "$MAIN_PUSH" = "true" ]; then backstops=true; else backstops=false; fi
          owed migrations         "$R_MIGRATIONS"         "$backstops"
          owed security           "$R_SECURITY"           "$backstops"
          owed docs-tests         "$R_DOCS"               "$DOCS_ONLY"
          owed contract-responses "$R_CONTRACT_RESPONSES" "$API_SUITES"
          owed integration-shards "$R_INTEGRATION"        "$API_SUITES"
          owed web-shards         "$R_WEB_SHARDS"         "$WEB_SUITES"
          owed web-browser        "$R_WEB_BROWSER"        "$WEB_SUITES"
          owed release-gate       "$R_RELEASE"            "$IS_TAG"
          exit "$failed"
