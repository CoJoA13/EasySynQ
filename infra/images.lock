# Single source of pinned container images (doc 03 §15; Compose references these, while `keycloak`
# is the base for infra/compose/keycloak/Dockerfile's optimized production image).
#
# DIGEST-PINNED (release ceremony, 2026-08-28). Each ref carries the immutable @sha256 the
# registry served at pin time, so a rebuild fetches the same bytes even if the tag is re-pointed.
# Every digest here was cross-checked against the digest the image was actually pulled by locally
# (`docker image inspect --format '{{index .RepoDigests 0}}'`) — an independent source from the
# registry query that produced it.
#
# Re-resolve with `just images-update` (needs Docker + network; the recipe retries and fails loudly
# rather than emitting a partial list). `just release-check` and CI's tag-gated release-gate job
# refuse a floating non-dev tag. No `:latest` anywhere (Phase-1 tech-debt: I-2).
#
# ⚠ The tag BEFORE the digest is load-bearing: scripts/airgap-bundle.sh saves each image under it,
# because `docker pull name:tag@sha256:…` lands the image UNTAGGED and Compose asks for the tag.
#
# service   image:tag                                   # @sha256:... (pin before release)
