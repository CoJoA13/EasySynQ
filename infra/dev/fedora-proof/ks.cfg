# Fedora 44 Everything netinstall boots Anaconda; the separately checksummed Workstation Live ISO
# is attached read-only and mounted in %pre. The host renders one-run SSH and password material.
#version=F44
text
lang en_US.UTF-8
keyboard us
timezone America/Chicago --utc
network --bootproto=dhcp --device=link --activate
firewall --enabled --service=ssh
selinux --enforcing
firstboot --disable
rootpw --lock
user --name=easysynq --groups=wheel --password=@@EASYSYNQ_PASSWORD_HASH@@ --iscrypted
services --enabled=sshd
ignoredisk --only-use=vda
zerombr
clearpart --all --initlabel --drives=vda
autopart --type=plain
bootloader --append="console=ttyS0,115200n8"
liveimg --url=file:///run/install/workstation-payload/LiveOS/squashfs.img
shutdown

%pre --erroronfail --log=/tmp/easysynq-proof-pre.log
set -eux
payload_mount=/run/install/workstation-payload
mkdir -p "$payload_mount"
payload_found=0
for device in /dev/sr*; do
  [ -b "$device" ] || continue
  if mount -o ro "$device" "$payload_mount" 2>/dev/null; then
    if [ -f "$payload_mount/LiveOS/squashfs.img" ]; then
      payload_found=1
      break
    fi
    umount "$payload_mount"
  fi
done
if [ "$payload_found" -ne 1 ]; then
  echo 'Fedora Workstation LiveOS/squashfs.img was not found on attached read-only media.' >&2
  exit 1
fi
%end

%post --nochroot --erroronfail --log=/mnt/sysimage/root/easysynq-proof-resolver.log
set -eux
if [ ! -e /mnt/sysimage/etc/resolv.conf ] && [ ! -L /mnt/sysimage/etc/resolv.conf ]; then
  echo 'Installed resolver target is missing; refusing an unowned replacement.' >&2
  exit 1
fi
cp -a -- /mnt/sysimage/etc/resolv.conf /mnt/sysimage/root/easysynq-proof-resolv.conf.original
rm -f -- /mnt/sysimage/etc/resolv.conf
install -m 0644 /etc/resolv.conf /mnt/sysimage/etc/resolv.conf
%end

%post --erroronfail --log=/root/easysynq-proof-post.log
set -eux
dnf install -y openssh-server sudo util-linux
id easysynq >/dev/null 2>&1 || useradd --create-home --groups wheel easysynq
usermod -aG wheel easysynq
install -d -m 0700 -o easysynq -g easysynq /home/easysynq/.ssh
cat >/home/easysynq/.ssh/authorized_keys <<'EASYSYNQ_PROOF_KEY'
@@EASYSYNQ_SSH_PUBLIC_KEY@@
EASYSYNQ_PROOF_KEY
chown easysynq:easysynq /home/easysynq/.ssh/authorized_keys
chmod 0600 /home/easysynq/.ssh/authorized_keys
printf '%s\n' 'easysynq ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/easysynq-proof
chmod 0440 /etc/sudoers.d/easysynq-proof
systemctl enable sshd
restorecon -RF /home/easysynq/.ssh /etc/sudoers.d/easysynq-proof
rm -f -- /etc/resolv.conf
mv -T -- /root/easysynq-proof-resolv.conf.original /etc/resolv.conf
%end
