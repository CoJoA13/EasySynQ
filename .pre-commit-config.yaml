# Contributor hooks use local commands or pinned PyPI packages; no remote hook clones.
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: local
    hooks:
      # Use the project's locked Ruff so local formatting always matches CI.
      - id: ruff
        name: ruff (project lock)
        entry: env UV_ASTRAL_MIRROR_URL=https://releases.astral.sh uv run --frozen --project apps/api ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        files: ^apps/api/
      - id: ruff-format
        name: ruff format (project lock)
        entry: env UV_ASTRAL_MIRROR_URL=https://releases.astral.sh uv run --frozen --project apps/api ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        files: ^apps/api/
      # Keep the full project environment and stubs used by CI's strict mypy check.
      - id: mypy
        name: mypy (strict, apps/api/src — uv run, matches CI)
        entry: env UV_ASTRAL_MIRROR_URL=https://releases.astral.sh bash -c 'cd apps/api && uv run --frozen mypy src'
        language: system
        files: ^apps/api/src/
        pass_filenames: false
        require_serial: true

      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: python
        additional_dependencies: [pre-commit-hooks==5.0.0]
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: python
        additional_dependencies: [pre-commit-hooks==5.0.0]
        types: [text]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        language: python
        additional_dependencies: [pre-commit-hooks==5.0.0]
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: python
        additional_dependencies: [pre-commit-hooks==5.0.0]
        types: [yaml]
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        name: check for added large files
        entry: check-added-large-files
        language: python
        additional_dependencies: [pre-commit-hooks==5.0.0]
        types: [file]
      # Install the pinned native tool using the contributor runbook; absence fails the hook.
      - id: gitleaks
        name: detect staged secrets
        entry: gitleaks protect --verbose --redact --staged
        language: system
        pass_filenames: false

      - id: repository-authority
        name: repository authority and Claude compatibility contracts
        entry: ./scripts/check-repo-authority.sh
        language: system
        pass_filenames: false
      # Keep the same locked contract lint command as CI.
      - id: contracts-lint
        name: openapi contract lint (redocly --config, matches CI)
        entry: bash scripts/run-contract-tool.sh redocly lint --config packages/contracts/redocly.yaml packages/contracts/openapi.yaml
        language: system
        files: ^packages/contracts/
        pass_filenames: false
